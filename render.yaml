# Render blueprint for the engine (the web app is on Vercel).
services:
  - type: web
    name: flappy-pipe-engine
    runtime: docker
    rootDir: apps/engine
    dockerfilePath: ./Dockerfile
    plan: starter          # always on; "free" works but sleeps after 15 min without visitors
    healthCheckPath: /health
    envVars:
      - key: CONTRACT_ID
        value: riptide-6024.testnet
      - key: ACCOUNT_PREFIX
        value: riptide-6024
      - key: ENGINE_KEY      # private key of riptide-6024-engine.testnet
        sync: false
      - key: BOT_KEY         # private key of riptide-6024-bot.testnet
        sync: false
